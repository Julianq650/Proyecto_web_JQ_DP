services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
    container_name: elasticsearch_proyecto_final
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      retries: 30

  # Crea los index templates (mappings) antes de que llegue cualquier log
  setup:
    image: curlimages/curl:8.11.1
    container_name: setup_proyecto_final
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch:/templates:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        curl -s -X PUT http://elasticsearch:9200/_index_template/nginx-logs -H 'Content-Type: application/json' -d @/templates/nginx-template.json
        echo
        curl -s -X PUT http://elasticsearch:9200/_index_template/app-logs -H 'Content-Type: application/json' -d @/templates/app-template.json
        echo
        echo "Templates creados"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.14
    container_name: kibana_proyecto_final
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit_proyecto_final
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/custom_parsers.conf:ro
    depends_on:
      setup:
        condition: service_completed_successfully

  # Crea los data views de Kibana automáticamente cuando Kibana termina de arrancar
  kibana-setup:
    image: curlimages/curl:8.11.1
    container_name: kibana-setup_proyecto_final
    depends_on: [kibana]
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Esperando a Kibana..."
        until curl -s http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 5; done
        curl -s -X POST http://kibana:5601/api/data_views/data_view -H 'kbn-xsrf: true' -H 'Content-Type: application/json' -d '{"data_view":{"id":"multidust-app","title":"app-logs-*","name":"Logs de Multi-Dust","timeFieldName":"@timestamp"}}'
        echo
        curl -s -X POST http://kibana:5601/api/data_views/data_view -H 'kbn-xsrf: true' -H 'Content-Type: application/json' -d '{"data_view":{"id":"multidust-nginx","title":"nginx-logs-*","name":"Logs de nginx","timeFieldName":"@timestamp"}}'
        echo
        echo "Data views listos"

  # Aplicación Django (gunicorn). Escribe logs ESTRUCTURADOS en JSON
  django:
    build: ./django
    container_name: django_proyecto_final
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=multidust-clave-solo-para-laboratorio
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,nginx,django
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@multidust.local
      - DJANGO_SUPERUSER_PASSWORD=MultiDust2026
      - CARGAR_DEMO=1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - static:/app/staticfiles
      - django_data:/app/data
    depends_on: [fluent-bit]
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: app

  # Servidor web: recibe las visitas y se las pasa a Django.
  # Escribe logs NO estructurados (formato de acceso de nginx)
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proyecto_final
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on: [django]
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: nginx

  # Simula visitantes: recorre el mapa y las canchas, entra a páginas restringidas
  # y hace intentos de ingreso fallidos (con token CSRF, como un navegador)
  generador-trafico:
    image: curlimages/curl:8.11.1
    container_name: generador-trafico_proyecto_final
    depends_on: [nginx]
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          for p in / /canchas/1/ /canchas/$$((RANDOM % 8 + 1))/ /canchas/6/ /no-existe /recepcion/ /administracion/; do
            curl -s -o /dev/null http://nginx$$p
            sleep 0.7
          done
          if [ $$((RANDOM % 3)) -eq 0 ]; then
            curl -s -c /tmp/c -o /dev/null http://nginx/login/
            t=$$(awk '/csrftoken/ {print $$7}' /tmp/c)
            curl -s -b /tmp/c -o /dev/null -H "X-CSRFToken: $$t" -H "Referer: http://nginx/login/" -d "csrfmiddlewaretoken=$$t&usuario=usuario$$((RANDOM % 20))&clave=incorrecta" http://nginx/login/
          fi
          sleep 1
        done

volumes:
  esdata:
  static:
  django_data:

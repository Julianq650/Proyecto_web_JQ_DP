[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  custom_parsers.conf

# ---------- ENTRADA: recibe los logs que Docker envía con el driver "fluentd" ----------
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# ---------- PROCESAMIENTO ----------
# Logs NO estructurados de nginx -> se separan en campos con una expresión regular
[FILTER]
    Name          parser
    Match         nginx
    Key_Name      log
    Parser        nginx_acceso
    Reserve_Data  On

# Logs estructurados en JSON -> se convierten directamente en campos
[FILTER]
    Name          parser
    Match         app
    Key_Name      log
    Parser        json_app
    Reserve_Data  On

# Agrega un campo con el entorno a todos los registros
[FILTER]
    Name    modify
    Match   *
    Add     entorno  laboratorio

# ---------- SALIDAS: un índice por tipo de log ----------
[OUTPUT]
    Name                es
    Match               nginx
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     nginx-logs
    Suppress_Type_Name  On
    Retry_Limit         False

[OUTPUT]
    Name                es
    Match               app
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     app-logs
    Suppress_Type_Name  On
    Retry_Limit         False

# Copia a la consola, útil para depurar con "docker logs fluent-bit"
[OUTPUT]
    Name   stdout
    Match  *

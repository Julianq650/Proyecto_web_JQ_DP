[PARSER]
    Name         nginx_acceso
    Format       regex
    Regex        ^(?<remote>[^ ]*) - (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>\d{3}) (?<size>\d+) "(?<referer>[^\"]*)" "(?<agent>[^\"]*)"
    Time_Key     time
    Time_Format  %d/%b/%Y:%H:%M:%S %z
    Types        code:integer size:integer

[PARSER]
    Name    json_app
    Format  json

{% extends 'modulo/base.html' %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="panel" style="max-width:520px;margin:20px auto">
<h1>Crear cuenta</h1><p class="sub">Con tu cuenta puedes reservar canchas y ver tus reservas.</p>
<form method="post" class="formulario" style="margin-top:16px">{% csrf_token %}
    {% for campo in form %}<label>{{ campo.label }}{{ campo }}{{ campo.errors }}{% if campo.help_text %}<span class="ayuda">{{ campo.help_text|safe }}</span>{% endif %}</label>{% endfor %}
    <button class="btn" type="submit">Crear cuenta</button>
</form></div>
{% endblock %}

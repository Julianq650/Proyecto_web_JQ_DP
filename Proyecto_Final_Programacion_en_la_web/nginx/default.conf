# nginx recibe todas las visitas: sirve los archivos estáticos
# y le pasa el resto de peticiones a Django (gunicorn)
upstream django_app {
    server django:8000;
}

server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /static/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
